<div class="outer">
    <div class="container">
        <div class="row">
            <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Signup</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">First Name</label>
                                <input type="text" id="firstName" formControlName="firstName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Last Name</label>
                                <input type="text" id="lastName" formControlName="lastName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Email</label>
                                <input type="email" id="email" formControlName="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" formControlName="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input [type]="type" id="password" formControlName="password" class="form-control" required>
                                <span (click)="togglePasswordVisibility()" class="fa {{eyeIcon}}"></span>
                            </div>
                           
                           
                            
                            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                            <div class="mb-3 text-center">
                                <a routerLink="/login" class="text-decoration-none">Already have account? Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
