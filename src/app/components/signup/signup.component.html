<div class="outer">
    <div class="container">
        <div class="row">
            <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Signup</h3>
                    </div>
                    <!-- <div class="card-body"> -->
                    <div class="panel-body p-3">
                        <form [formGroup]="signUpForm">
                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="signUpForm.controls['firstName'].dirty &&  signUpForm.hasError('required', 'firstName')">
                                    <span class="fa fa-user p-2"></span>
                                    <input type="text" id="firstName" formControlName="firstName" class="form-control"
                                        placeholder="First Name">
                                </div>
                            </div>
                            <small
                                *ngIf="signUpForm.controls['firstName'].dirty && signUpForm.hasError('required', 'firstName')"
                                class="text-danger">*FirstName is required </small>

                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="signUpForm.controls['lastName'].dirty &&  signUpForm.hasError('required', 'lastName')">
                                    <span class="fa fa-user p-2"></span>
                                    <input type="text" id="lastName" formControlName="lastName" class="form-control"
                                        placeholder="Last Name">
                                </div>
                            </div>
                            <small
                                *ngIf="signUpForm.controls['lastName'].dirty && signUpForm.hasError('required', 'lastName')"
                                class="text-danger">*LastName is required </small>

                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="signUpForm.controls['email'].dirty &&  signUpForm.hasError('required', 'email')">
                                    <span class="fa fa-user p-2"></span>
                                    <input type="email" id="email" formControlName="email" class="form-control"
                                        placeholder="Email">
                                </div>
                            </div>
                            <small
                                *ngIf="signUpForm.controls['email'].dirty && signUpForm.hasError('required', 'email')"
                                class="text-danger">*Email is required </small>

                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="signUpForm.controls['username'].dirty &&  signUpForm.hasError('required', 'username')">
                                    <span class="fa fa-user p-2"></span>
                                    <input type="text" id="username" formControlName="username" class="form-control"
                                        placeholder="Username" required>
                                </div>
                            </div>
                            <small
                                *ngIf="signUpForm.controls['username'].dirty && signUpForm.hasError('required', 'username')"
                                class="text-danger">*Username is required</small>

                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="signUpForm.controls['password'].dirty &&  signUpForm.hasError('required', 'password')">
                                    <span class="fa fa-lock p-2"></span>
                                    <input [type]="type" id="password" formControlName="password" class="form-control"
                                        placeholder="Password" required>
                                    <span (click)="togglePasswordVisibility()" class="fa {{eyeIcon}}"></span>
                                </div>
                            </div>
                            <small
                                *ngIf="signUpForm.controls['password'].dirty && signUpForm.hasError('required', 'password')"
                                class="text-danger">*Password is required</small>


                            <button type="submit" class="btn btn-primary btn-block mt-4 w-100" (click)="onSubmit()">Sign
                                Up</button>
                            <div class="text-center pt-4 text-muted">
                                Already have an account?
                                <a routerLink="/login" class="text-decoration-none">Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
