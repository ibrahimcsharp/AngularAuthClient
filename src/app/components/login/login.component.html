<div class="outer">
    <div class="container">
        <div class="row">
            <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Login</h3>
                    </div>
                    <!-- <div class="card-body"> -->
                    <div class="panel-body p-3">
                        <form [formGroup]="loginForm">
                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="loginForm.controls['username'].dirty &&  loginForm.hasError('required', 'username')">
                                    <span class="fa fa-user p-2"></span>
                                    <input type="text" id="username" formControlName="username" class="form-control"
                                        placeholder="Username" required>
                                </div>
                            </div>
                            <small class="text-danger"
                                *ngIf="loginForm.controls['username'].dirty && loginForm.hasError('required', 'username')">*Username
                                is required</small>

                            <div class="form-group pt-3">
                                <div class="input-field"
                                    [class.error]="loginForm.controls['password'].dirty &&  loginForm.hasError('required', 'password')">
                                    <span class="fa fa-lock p-2"></span>
                                    <input [type]="type" id="password" formControlName="password" class="form-control"
                                        placeholder="Password" required>
                                    <span (click)="togglePasswordVisibility()" class="fa {{eyeIcon}}"></span>
                                </div>
                            </div>
                            <small class="text-danger"
                                *ngIf="loginForm.controls['password'].dirty && loginForm.hasError('required', 'password')">*Password
                                is required</small>


                            <!-- <div class="mb-3 form-check">
                                <input type="checkbox" id="rememberMe" formControlName="rememberMe" class="form-check-input">
                                <label for="rememberMe" class="form-check-label">Remember Me</label>
                            </div> -->


                            <div class="form-inline fr mt-4"> <a id="forgot" data-bs-toggle="modal"
                                    data-bs-target="#exampleModal" class="font-weight-bold">Forgot password?</a> </div>
                            <button type="submit" class="btn btn-primary btn-block mt-4 w-100"
                                (click)="onSubmit()">Login</button>
                            <div class="text-center pt-4 text-muted">
                                Don't have an account? <a id="forget" routerLink="/signup"> Register</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <p class="modal-title" id="exampleModalLabel"> <span style="font-size: 25px;font-weight:700">Forget your
                        password?</span><br>
                    <small>Please provide your E-mail we will send the reset link</small>
                </p>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

            </div>

            <div class="modal-body">
                <div class="form-group pt-3">
                    <div class="input-field"> <span class="fa fa-user p-2"></span>
                        <input [(ngModel)]="resetPasswordEmail" (ngModelChange)="checkEmailValidity($event)" type="text"
                            placeholder="Email">
                    </div>
                </div>
                <small *ngIf="!resetPasswordEmail" class="text-danger">*Email is required*</small>
                <small *ngIf="!isValidEmail $$ resetPasswordEmail" class="text-danger">*Email is invalid*</small>
            </div>
            <div class="modal-footer">
                <button type="button" id="closeBtn" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" (click)="confrimToSendResetPasswordEmail()">Send</button>
            </div>
        </div>
    </div>
</div>
