<div class="outer">
    <div class="container">
        <div class="row">
            <div class="offset-md-2 col-lg-5 col-md-7 offset-lg-4 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Login</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" formControlName="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input [type]="type" id="password" formControlName="password" class="form-control" required>
                                <span (click)="togglePasswordVisibility()" class="fa {{eyeIcon}}"></span>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" id="rememberMe" formControlName="rememberMe" class="form-check-input">
                                <label for="rememberMe" class="form-check-label">Remember Me</label>
                            </div>
                           
                            <div class="mb-3">
                                <a routerLink="/forgot-password" class="text-decoration-none">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                            <div class="mb-3 text-center">
                                <a routerLink="/signup" class="text-decoration-none">Don't have an account? Register</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
